<style>
  @keyframes mtopo-ping-travel {
    0% { offset-distance: 0%; opacity: 1; }
    12.5% { offset-distance: 100%; opacity: 1; }
    12.6% { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes mtopo-ping-glow {
    0% { r: 1; opacity: 0.8; }
    6.25% { r: 3; opacity: 0.4; }
    12.5% { r: 5; opacity: 0; }
    100% { opacity: 0; }
  }

  /* Node specific status animations */
  @keyframes st-sender {
    0%, 12.5% { opacity: 1; transform: translateY(0); background: #10b981; }
    15%, 100% { opacity: 0; transform: translateY(-10px); background: #10b981; }
  }
  @keyframes ct-sender { 0%, 100% { content: "Sent"; } }

  @keyframes st-mute1 {
    0%, 11% { opacity: 0; transform: translateY(10px); }
    12.5%, 30% { opacity: 1; transform: translateY(0); background: #6b7280; }
    35%, 100% { opacity: 0; transform: translateY(-10px); background: #6b7280; }
  }
  @keyframes ct-mute1 { 0%, 100% { content: "Won't Relay"; } }

  @keyframes st-base {
    0%, 11% { opacity: 0; transform: translateY(10px); }
    12.5%, 20.7% { opacity: 1; transform: translateY(0); background: #3b82f6; }
    20.8%, 35% { opacity: 1; transform: translateY(0); background: #10b981; }
    40%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes ct-base {
    0%, 20.7% { content: "Queued"; }
    20.8%, 100% { content: "Sent"; }
  }

  @keyframes st-client-cancel {
    0%, 31% { opacity: 0; transform: translateY(10px); }
    33.3%, 58.2% { opacity: 1; transform: translateY(0); background: #3b82f6; }
    58.3%, 75% { opacity: 1; transform: translateY(0); background: #ef4444; }
    80%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes ct-client-cancel {
    0%, 58.2% { content: "Queued"; }
    58.3%, 100% { content: "Cancelled"; }
  }

  @keyframes st-client-relay {
    0%, 31% { opacity: 0; transform: translateY(10px); }
    33.3%, 45.7% { opacity: 1; transform: translateY(0); background: #3b82f6; }
    45.8%, 60% { opacity: 1; transform: translateY(0); background: #10b981; }
    65%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes ct-client-relay {
    0%, 45.7% { content: "Queued"; }
    45.8%, 100% { content: "Sent"; }
  }

  @keyframes st-router {
    0%, 57% { opacity: 0; transform: translateY(10px); }
    58.3%, 62.4% { opacity: 1; transform: translateY(0); background: #3b82f6; }
    62.5%, 75% { opacity: 1; transform: translateY(0); background: #10b981; }
    80%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes ct-router {
    0%, 62.4% { content: "Queued"; }
    62.5%, 100% { content: "Sent"; }
  }

  @keyframes st-client-right {
    0%, 57% { opacity: 0; transform: translateY(10px); }
    58.3%, 74.9% { opacity: 1; transform: translateY(0); background: #3b82f6; }
    75%, 90% { opacity: 1; transform: translateY(0); background: #ef4444; }
    95%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes ct-client-right {
    0%, 74.9% { content: "Queued"; }
    75%, 100% { content: "Cancelled"; }
  }

  @keyframes st-dest {
    0%, 73% { opacity: 0; transform: translateY(10px); }
    75%, 95% { opacity: 1; transform: translateY(0); background: #10b981; }
    98%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes ct-dest { 0%, 100% { content: "Received!"; } }

  .mtopo-node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  .mtopo-device {
    width: 48px;
    height: 48px;
    object-fit: contain;
    position: relative;
    z-index: 10;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
  }
  .mtopo-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-neutral-800);
    margin-top: 4px;
    white-space: nowrap;
    background: rgba(255,255,255,0.8);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .mtopo-status {
    position: absolute;
    top: -24px;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 7px;
    border-radius: 12px;
    color: white;
    white-space: nowrap;
    opacity: 0;
  }

  #st-0 { animation: st-sender 12s infinite; }
  #st-0::before { animation: ct-sender 12s infinite; }
  #st-1 { animation: st-mute1 12s infinite; }
  #st-1::before { animation: ct-mute1 12s infinite; }
  #st-2 { animation: st-base 12s infinite; }
  #st-2::before { animation: ct-base 12s infinite; }
  #st-3, #st-4 { animation: st-client-cancel 12s infinite; }
  #st-3::before, #st-4::before { animation: ct-client-cancel 12s infinite; }
  #st-5 { animation: st-client-relay 12s infinite; }
  #st-5::before { animation: ct-client-relay 12s infinite; }
  #st-8 { animation: st-router 12s infinite; }
  #st-8::before { animation: ct-router 12s infinite; }
  #st-9 { animation: st-client-right 12s infinite; }
  #st-9::before { animation: ct-client-right 12s infinite; }
  #st-10 { animation: st-dest 12s infinite; }
  #st-10::before { animation: ct-dest 12s infinite; }
</style>

<div style="position:relative;flex:1;background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden;min-height:500px;border:1px solid var(--color-neutral-300)">
  <svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible" viewBox="0 0 1000 500">

    <line x1="100" y1="250" x2="100" y2="400" stroke="#9ca3af" stroke-width="2" />

    <line x1="750" y1="150" x2="920" y2="225" stroke="#9ca3af" stroke-width="2" />

    <!-- PING ANIMATIONS (12s loops) -->
    <!-- Wave 1: Sender (t=0s) -->
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 100 250 L 100 400'); animation: mtopo-ping-travel 12s infinite 0s;" /></g>
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 100 250 L 250 325'); animation: mtopo-ping-travel 12s infinite 0s;" /></g>
    <circle cx="100" cy="250" fill="none" stroke="#10b981" stroke-width="2" style="animation: mtopo-ping-glow 12s infinite 0s;" />
    
    <!-- Wave 2: Base (t=2.5s) -->
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 250 325 L 450 150'); animation: mtopo-ping-travel 12s infinite 2.5s;" /></g>
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 250 325 L 450 275'); animation: mtopo-ping-travel 12s infinite 2.5s;" /></g>
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 250 325 L 600 375'); animation: mtopo-ping-travel 12s infinite 2.5s;" /></g>
    <circle cx="250" cy="325" fill="none" stroke="#10b981" stroke-width="2" style="animation: mtopo-ping-glow 12s infinite 2.5s;" />

    <!-- Wave 3: Far Client (t=5.5s) -->
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 600 375 L 450 150'); animation: mtopo-ping-travel 12s infinite 5.5s;" /></g>
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 600 375 L 450 275'); animation: mtopo-ping-travel 12s infinite 5.5s;" /></g>
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 600 375 L 750 150'); animation: mtopo-ping-travel 12s infinite 5.5s;" /></g>
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 600 375 L 750 300'); animation: mtopo-ping-travel 12s infinite 5.5s;" /></g>
    <circle cx="600" cy="375" fill="none" stroke="#10b981" stroke-width="2" style="animation: mtopo-ping-glow 12s infinite 5.5s;" />

    <!-- Wave 4: Router (t=7.5s) -->
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 750 150 L 750 300'); animation: mtopo-ping-travel 12s infinite 7.5s;" /></g>
    <g><circle r="4" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 750 150 L 920 225'); animation: mtopo-ping-travel 12s infinite 7.5s;" /></g>
    <circle cx="750" cy="150" fill="none" stroke="#10b981" stroke-width="2" style="animation: mtopo-ping-glow 12s infinite 7.5s;" />
  </svg>
