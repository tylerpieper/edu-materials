<style>
  @keyframes mtopo-ping-travel {
    0% { offset-distance: 0%; opacity: 1; }
    12.5% { offset-distance: 100%; opacity: 1; }
    12.6% { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes mtopo-ping-glow {
    0% { r: 1; opacity: 0.8; }
    6.25% { r: 3; opacity: 0.4; }
    12.5% { r: 5; opacity: 0; }
    100% { opacity: 0; }
  }

  /* Node specific status animations */
  @keyframes mtopo-status-sender {
    0% { opacity: 1; transform: translateY(0); background: #10b981; }
    12.5% { opacity: 1; transform: translateY(0); }
    15% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }
  @keyframes mtopo-status-mute1 {
    0%, 11% { opacity: 0; transform: translateY(10px); }
    12.5%, 30% { opacity: 1; transform: translateY(0); background: #6b7280; }
    35% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }
  @keyframes mtopo-status-base {
    0%, 11% { opacity: 0; transform: translateY(10px); }
    12.5%, 20.8% { opacity: 1; transform: translateY(0); background: #3b82f6; content: "Queued"; }
    20.9%, 33% { opacity: 1; transform: translateY(0); background: #10b981; content: "Relaying"; }
    35% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }
  @keyframes mtopo-status-client-top {
    0%, 31% { opacity: 0; transform: translateY(10px); }
    33.3%, 57% { opacity: 1; transform: translateY(0); background: #3b82f6; content: "Queued"; }
    58.3%, 75% { opacity: 1; transform: translateY(0); background: #ef4444; content: "Cancelled"; }
    80% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }
  @keyframes mtopo-status-client-far {
    0%, 31% { opacity: 0; transform: translateY(10px); }
    33.3%, 45.8% { opacity: 1; transform: translateY(0); background: #3b82f6; content: "Queued"; }
    45.9%, 58% { opacity: 1; transform: translateY(0); background: #10b981; content: "Relaying"; }
    60% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }
  @keyframes mtopo-status-router {
    0%, 57% { opacity: 0; transform: translateY(10px); }
    58.3%, 70% { opacity: 1; transform: translateY(0); background: #f59e0b; content: "Instant Relay"; }
    75% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }
  @keyframes mtopo-status-dest {
    0%, 69% { opacity: 0; transform: translateY(10px); }
    70.8%, 95% { opacity: 1; transform: translateY(0); background: #10b981; content: "Received!"; }
    98% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 0; }
  }

  .mtopo-node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  .mtopo-device {
    width: 60px;
    height: 60px;
    object-fit: contain;
    position: relative;
    z-index: 10;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
  }
  .mtopo-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-neutral-800);
    margin-top: 4px;
    white-space: nowrap;
    background: rgba(255,255,255,0.8);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .mtopo-status {
    position: absolute;
    top: -24px;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 12px;
    color: white;
    white-space: nowrap;
    opacity: 0;
  }
  .mtopo-status::before { content: attr(data-text); }

  #st-0 { animation: mtopo-status-sender 12s infinite; }
  #st-1 { animation: mtopo-status-mute1 12s infinite; }
  #st-2 { animation: mtopo-status-base 12s infinite; }
  #st-3, #st-4 { animation: mtopo-status-client-top 12s infinite; }
  #st-5 { animation: mtopo-status-client-far 12s infinite; }
  #st-8 { animation: mtopo-status-router 12s infinite; }
  #st-10 { animation: mtopo-status-dest 12s infinite; }
</style>

<div style="position:relative;flex:1;background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden;min-height:500px;border:1px solid var(--color-neutral-300)">
  <svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <filter id="mtopo-glow">
        <feGaussianBlur stdDeviation="0.5" result="coloredBlur" />
        <feMerge>
          <feMergeNode in="coloredBlur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <!-- Arrowheads -->
      <marker id="arrow-solid" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
      </marker>
      <marker id="arrow-dotted" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
      </marker>
    </defs>

    <!-- Background Lines -->
    <!-- Solid (relay) lines -->
    <line x1="10" y1="50" x2="25" y2="65" stroke="#10b981" stroke-width="0.3" marker-end="url(#arrow-solid)" />
    <line x1="25" y1="65" x2="60" y2="75" stroke="#10b981" stroke-width="0.3" marker-end="url(#arrow-solid)" />
    <line x1="60" y1="75" x2="75" y2="30" stroke="#10b981" stroke-width="0.3" marker-end="url(#arrow-solid)" />
    <line x1="75" y1="30" x2="92" y2="45" stroke="#10b981" stroke-width="0.3" marker-end="url(#arrow-solid)" />

    <!-- Dotted (dead end) lines -->
    <line x1="10" y1="50" x2="10" y2="80" stroke="#9ca3af" stroke-width="0.3" stroke-dasharray="2 1" marker-end="url(#arrow-dotted)" />
    <line x1="25" y1="65" x2="45" y2="30" stroke="#9ca3af" stroke-width="0.3" stroke-dasharray="2 1" marker-end="url(#arrow-dotted)" />
    <line x1="25" y1="65" x2="45" y2="55" stroke="#9ca3af" stroke-width="0.3" stroke-dasharray="2 1" marker-end="url(#arrow-dotted)" />
    <line x1="60" y1="75" x2="45" y2="30" stroke="#9ca3af" stroke-width="0.3" stroke-dasharray="2 1" marker-end="url(#arrow-dotted)" />
    <line x1="60" y1="75" x2="45" y2="55" stroke="#9ca3af" stroke-width="0.3" stroke-dasharray="2 1" marker-end="url(#arrow-dotted)" />
    <line x1="75" y1="30" x2="75" y2="60" stroke="#9ca3af" stroke-width="0.3" stroke-dasharray="2 1" marker-end="url(#arrow-dotted)" />

    <!-- PING ANIMATIONS (12s loops) -->
    <!-- Wave 1: Sender (t=0s) -->
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 10 50 L 10 80'); animation: mtopo-ping-travel 12s infinite 0s;" /></g>
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 10 50 L 25 65'); animation: mtopo-ping-travel 12s infinite 0s;" /></g>
    <circle cx="10" cy="50" fill="none" stroke="#10b981" stroke-width="0.4" style="animation: mtopo-ping-glow 12s infinite 0s;" />
    
    <!-- Wave 2: Base (t=2.5s -> 2.5/12 = 20.8%) -->
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 25 65 L 45 30'); animation: mtopo-ping-travel 12s infinite 2.5s;" /></g>
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 25 65 L 45 55'); animation: mtopo-ping-travel 12s infinite 2.5s;" /></g>
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 25 65 L 60 75'); animation: mtopo-ping-travel 12s infinite 2.5s;" /></g>
    <circle cx="25" cy="65" fill="none" stroke="#10b981" stroke-width="0.4" style="animation: mtopo-ping-glow 12s infinite 2.5s;" />

    <!-- Wave 3: Far Client (t=5.5s -> 5.5/12 = 45.8%) -->
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 60 75 L 45 30'); animation: mtopo-ping-travel 12s infinite 5.5s;" /></g>
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 60 75 L 45 55'); animation: mtopo-ping-travel 12s infinite 5.5s;" /></g>
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 60 75 L 75 30'); animation: mtopo-ping-travel 12s infinite 5.5s;" /></g>
    <circle cx="60" cy="75" fill="none" stroke="#10b981" stroke-width="0.4" style="animation: mtopo-ping-glow 12s infinite 5.5s;" />

    <!-- Wave 4: Router (t=7.0s -> 7.0/12 = 58.3%) -->
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 75 30 L 75 60'); animation: mtopo-ping-travel 12s infinite 7.0s;" /></g>
    <g><circle r="1.5" fill="#10b981" filter="url(#mtopo-glow)" style="offset-path: path('M 75 30 L 92 45'); animation: mtopo-ping-travel 12s infinite 7.0s;" /></g>
    <circle cx="75" cy="30" fill="none" stroke="#10b981" stroke-width="0.4" style="animation: mtopo-ping-glow 12s infinite 7.0s;" />
  </svg>
  
  <!-- Nodes HTML -->
  <div class="mtopo-node" style="left: 10%; top: 50%;">
    <div id="st-0" class="mtopo-status" data-text="Sending..."></div>
    <img src="assets/seeed_mesh_tracker_x1.svg" class="mtopo-device">
    <div class="mtopo-label">client_mute</div>
  </div>
  <div class="mtopo-node" style="left: 10%; top: 80%;">
    <div id="st-1" class="mtopo-status" data-text="Ignored"></div>
    <img src="assets/rak_wismesh_tag.svg" class="mtopo-device">
    <div class="mtopo-label">client_mute</div>
  </div>
  <div class="mtopo-node" style="left: 25%; top: 65%;">
    <div id="st-2" class="mtopo-status" data-text="Queued"></div>
    <img src="assets/rak3401.svg" class="mtopo-device">
    <div class="mtopo-label">client_base</div>
  </div>
  <div class="mtopo-node" style="left: 45%; top: 30%;">
    <div id="st-3" class="mtopo-status" data-text="Queued"></div>
    <img src="assets/heltec-t096.svg" class="mtopo-device">
    <div class="mtopo-label">client</div>
  </div>
  <div class="mtopo-node" style="left: 45%; top: 55%;">
    <div id="st-4" class="mtopo-status" data-text="Queued"></div>
    <img src="assets/tracker-t1000-e.svg" class="mtopo-device">
    <div class="mtopo-label">client</div>
  </div>
  <div class="mtopo-node" style="left: 60%; top: 75%;">
    <div id="st-5" class="mtopo-status" data-text="Queued"></div>
    <img src="assets/t-deck.svg" class="mtopo-device">
    <div class="mtopo-label">client</div>
  </div>
  <div class="mtopo-node" style="left: 75%; top: 30%;">
    <div id="st-8" class="mtopo-status" data-text="Instant Relay"></div>
    <img src="assets/station-g3.svg" class="mtopo-device">
    <div class="mtopo-label">router</div>
  </div>
  <div class="mtopo-node" style="left: 75%; top: 60%;">
    <div id="st-9" class="mtopo-status" data-text=""></div>
    <img src="assets/seeed_mesh_tracker_x1.svg" class="mtopo-device">
    <div class="mtopo-label">client</div>
  </div>
  <div class="mtopo-node" style="left: 92%; top: 45%;">
    <div id="st-10" class="mtopo-status" data-text="Received!"></div>
    <img src="assets/heltec-t096.svg" class="mtopo-device">
    <div class="mtopo-label">client_mute</div>
  </div>
</div>
